<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 16px;
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #1e40af;
        }

        #result {
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        a {
            display: block;
            margin: 10px 0;
            color: #2563eb;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔗 URL Shortener</h1>

    <input
            type="text"
            id="longUrl"
            placeholder="Enter long URL here"
    />

    <button onclick="shortenUrl()">Shorten</button>

    <div id="result" class="hidden">
        <p>Your Short URL:</p>
        <a id="shortUrl" target="_blank"></a>
        <button onclick="copyUrl()">Copy</button>
    </div>
</div>

<script>
    const API_BASE_URL = window.location.origin; // Automatically uses current domain

    async function shortenUrl() {
        const longUrl = document.getElementById("longUrl").value;

        if (!longUrl) {
            alert("Please enter a URL");
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/api/urls`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ longUrl })
            });

            if (!response.ok) {
                throw new Error("Failed to shorten URL");
            }

            const data = await response.json();

            const shortUrlElement = document.getElementById("shortUrl");
            shortUrlElement.href = data.shortUrl;
            shortUrlElement.innerText = data.shortUrl;

            document.getElementById("result").classList.remove("hidden");

        } catch (error) {
            alert("Something went wrong");
            console.error(error);
        }
    }

    function copyUrl() {
        const shortUrl = document.getElementById("shortUrl").innerText;
        navigator.clipboard.writeText(shortUrl);
        alert("Copied to clipboard!");
    }
</script>

</body>
</html>
